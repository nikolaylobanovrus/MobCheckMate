# Production stack: game server, PostgreSQL and Caddy (HTTPS with automatic Let's Encrypt certificates).
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
# See docs/DEPLOY.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: chess-server
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/chess
      DATABASE_USER: chess
      DATABASE_PASSWORD: ${DB_PASSWORD}
      BOT_OPPONENTS: ${BOT_OPPONENTS:-on}
      BOT_WAIT_SECONDS: ${BOT_WAIT_SECONDS:-8}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  db-data:
  caddy-data:
  caddy-config:
