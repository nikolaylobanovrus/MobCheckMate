# Chess Victory behind the host nginx. setup.sh installs it as /etc/nginx/sites-available/chess; certbot later
# adds the HTTPS block (chess-pull.sh runs it once DNS points here). The neighbours' sites are not touched: nginx
# picks this block by server_name.
map $http_upgrade $chess_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess.4vic.ru;

    # Written by chess-pull.sh: which build runs and how the last deploy went. Nothing private in it.
    location = /deploy-status.json {
        alias /var/www/chess-status/deploy-status.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chess_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Games are long WebSocket connections; the server pings every 15 seconds.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
