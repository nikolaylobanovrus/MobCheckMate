name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Tests and lint
        run: >
          ./gradlew --console=plain
          :shared:jvmTest :server:test
          :androidApp:testPlayDebugUnitTest :androidApp:lintPlayDebug

      - name: Debug APKs
        run: ./gradlew --console=plain :androidApp:assemblePlayDebug :androidApp:assembleRustoreDebug

      # Screenshot differences are reported, not enforced: fonts may render slightly differently on CI machines.
      - name: Compare screenshots
        run: ./gradlew --console=plain :androidApp:compareRoborazziPlayDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: androidApp/build/outputs/apk/**/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            androidApp/build/outputs/roborazzi/
          if-no-files-found: ignore

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f server/Dockerfile -t chess-server .
      - name: Smoke test
        run: |
          docker run -d --name chess -p 8080:8080 chess-server
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && exit 0; sleep 2; done
          docker logs chess
          exit 1

  # The VPS deploys from this branch by itself (deploy/beget/chess-pull.sh, every five minutes). It holds only the
  # server build of the latest commit that passed the jobs above: one commit, no history, no sources.
  publish-server:
    name: Publish server build for the VPS
    needs: [build, server-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/busy-meitner-2gl6it')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --console=plain :server:installDist

      - name: Push to deploy/chess-server-dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd server/build/install/server
          echo "${GITHUB_SHA::10} ${GITHUB_REF_NAME}" > SOURCE
          git init -q -b dist
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Server build of ${GITHUB_SHA::10} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/deploy/chess-server-dist
